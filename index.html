<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studentform</title>
    
</head>

<body>

    <div class="wrapper">
        <form action="submit_form.php" method="POST">
            <h1>Student Fill-Up Form</h1>
            <div class="input-box">
                <input type="text" id= "fname "name="fname" placeholder="Enter Your Full Name" required>
            </div>
            <div class="input-box">
                <input type="email" name="email" placeholder=" Enter Your Email" required>
            </div>
            
    
           <div class="dropdown">
                <select id="select" name="select">
                    <option value="" disable selected hidden>Gender</option>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                </select>
           </div>

            <div class="input-box">
                <input type="number" id="age "name="age" placeholder="Enter Your Age" required>
            </div>

            <div class="input-box">
                <input type="text" id= "course" name="course" placeholder="Enter Your Course" required>
            </div>

            <button type="submit" class="btn">Submit Form</button>


            
        
        </div>
        </form>


    </div>
